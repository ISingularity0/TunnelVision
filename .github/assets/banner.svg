<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title desc">
	<title id="title">TunnelVision</title>
	<desc id="desc">Flying through a glacite mineshaft tunnel while gemstones fly past.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0a1426"/>
			<stop offset="1" stop-color="#050a14"/>
		</linearGradient>
		<radialGradient id="glow" cx="50%" cy="53%" r="38%">
			<stop offset="0" stop-color="#7dd3fc" stop-opacity="0.22"/>
			<stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="calm" cx="50%" cy="52%" r="30%">
			<stop offset="0" stop-color="#050a14" stop-opacity="0.85"/>
			<stop offset="0.6" stop-color="#050a14" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#050a14" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
			<stop offset="0.6" stop-color="#000" stop-opacity="0"/>
			<stop offset="1" stop-color="#000" stop-opacity="0.65"/>
		</radialGradient>
		<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
			<stop offset="1" stop-color="#7dd3fc" stop-opacity="0.35"/>
		</linearGradient>
		<path id="arch" d="M-160 100 V-40 Q-160 -100 -100 -100 H100 Q160 -100 160 -40 V100 Z"/>
		<path id="gem" d="M0 -10 L8 0 L0 10 L-8 0 Z"/>
	</defs>

	<style>
		.ring {
			fill: none;
			stroke: #7dd3fc;
			stroke-width: 2;
			vector-effect: non-scaling-stroke;
			transform-box: fill-box;
			transform-origin: 50% 50%;
			animation: fly 8s cubic-bezier(.7, 0, 1, .6) infinite;
		}
		.ring.beam { stroke: #c4b5fd; }
		.gem {
			transform-box: fill-box;
			transform-origin: 50% 50%;
			animation: burst 4s cubic-bezier(.5, 0, 1, 1) infinite;
			opacity: 0;
		}
		.title {
			font: 800 76px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
			letter-spacing: 2px;
			fill: #f8fafc;
		}
		.title .accent { fill: #7dd3fc; }
		.sub {
			font: 600 22px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
			letter-spacing: 3px;
			fill: #bae6fd;
		}
		@keyframes fly {
			0% { transform: scale(0.04); opacity: 0; }
			12% { opacity: 0.9; }
			80% { opacity: 0.5; }
			100% { transform: scale(5); opacity: 0; }
		}
		@keyframes burst {
			0% { transform: translateX(30px) scale(0.2) rotate(0deg); opacity: 0; }
			25% { opacity: 1; }
			100% { transform: translateX(780px) scale(2.6) rotate(180deg); opacity: 0; }
		}
		@media (prefers-reduced-motion: reduce) {
			.ring { animation: none; transform: scale(var(--s)); opacity: 0.45; }
			.gem { animation: none; display: none; }
		}
	</style>

	<rect width="1280" height="360" fill="url(#bg)"/>
	<rect width="1280" height="360" fill="url(#glow)"/>

	<g transform="translate(640 190)">
		<g stroke="url(#edge)" stroke-width="1.5">
			<line x1="0" y1="0" x2="-1120" y2="700"/>
			<line x1="0" y1="0" x2="1120" y2="700"/>
			<line x1="0" y1="0" x2="-1120" y2="-490"/>
			<line x1="0" y1="0" x2="1120" y2="-490"/>
		</g>

		<use href="#arch" class="ring" style="animation-delay: 0s; --s: 0.25"/>
		<use href="#arch" class="ring beam" style="animation-delay: -1s; --s: 0.5"/>
		<use href="#arch" class="ring" style="animation-delay: -2s; --s: 0.85"/>
		<use href="#arch" class="ring beam" style="animation-delay: -3s; --s: 1.3"/>
		<use href="#arch" class="ring" style="animation-delay: -4s; --s: 1.9"/>
		<use href="#arch" class="ring beam" style="animation-delay: -5s; --s: 2.7"/>
		<use href="#arch" class="ring" style="animation-delay: -6s; --s: 3.6"/>
		<use href="#arch" class="ring beam" style="animation-delay: -7s; --s: 4.6"/>

		<g transform="rotate(-160)"><use href="#gem" class="gem" fill="#ef4444" style="animation-delay: 0s"/></g>
		<g transform="rotate(-20)"><use href="#gem" class="gem" fill="#3b82f6" style="animation-delay: -0.3s"/></g>
		<g transform="rotate(200)"><use href="#gem" class="gem" fill="#22c55e" style="animation-delay: -0.6s"/></g>
		<g transform="rotate(10)"><use href="#gem" class="gem" fill="#f59e0b" style="animation-delay: -0.9s"/></g>
		<g transform="rotate(170)"><use href="#gem" class="gem" fill="#a855f7" style="animation-delay: -1.2s"/></g>
		<g transform="rotate(-35)"><use href="#gem" class="gem" fill="#ec4899" style="animation-delay: -1.5s"/></g>
		<g transform="rotate(145)"><use href="#gem" class="gem" fill="#fde047" style="animation-delay: -1.8s"/></g>
		<g transform="rotate(25)"><use href="#gem" class="gem" fill="#22d3ee" style="animation-delay: -2.1s"/></g>
		<g transform="rotate(-145)"><use href="#gem" class="gem" fill="#84cc16" style="animation-delay: -2.4s"/></g>
		<g transform="rotate(-5)"><use href="#gem" class="gem" fill="#f8fafc" style="animation-delay: -2.7s"/></g>
		<g transform="rotate(190)"><use href="#gem" class="gem" fill="#3b82f6" style="animation-delay: -3s"/></g>
		<g transform="rotate(35)"><use href="#gem" class="gem" fill="#ef4444" style="animation-delay: -3.3s"/></g>
		<g transform="rotate(-175)"><use href="#gem" class="gem" fill="#f59e0b" style="animation-delay: -3.6s"/></g>
		<g transform="rotate(160)"><use href="#gem" class="gem" fill="#22c55e" style="animation-delay: -3.9s"/></g>
	</g>

	<rect width="1280" height="360" fill="url(#calm)"/>
	<rect width="1280" height="360" fill="url(#vignette)"/>

	<text class="title" x="640" y="190" text-anchor="middle">Tunnel<tspan class="accent">Vision</tspan></text>
	<text class="sub" x="640" y="236" text-anchor="middle">MINING &amp; GLACITE MINESHAFT FEATURES FOR HYPIXEL SKYBLOCK</text>
</svg>
