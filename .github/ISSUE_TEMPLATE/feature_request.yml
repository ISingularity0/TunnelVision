name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in-game where this would help.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How should it work? Screenshots or mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other mods that already do this, or workarounds you use now.
